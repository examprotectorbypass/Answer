<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sharkmind — Remote Session</title>
    <script src="config.js"></script>
    <script src="https://cdn.socket.io/4.8.3/socket.io.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        html, body { 
            font-family: 'Inter', sans-serif; 
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            overflow: hidden;
        }
        body {
            height: 100vh;
            height: 100dvh;
            display: flex;
            flex-direction: column;
        }
        .in-window-fullscreen {
            position: fixed !important;
            inset: 0 !important;
            z-index: 99999 !important;
            border-radius: 0 !important;
            margin: 0 !important;
        }
        .side-panel { transition: width 0.2s ease, opacity 0.2s ease; }
        .side-panel.closed { width: 0 !important; opacity: 0; pointer-events: none; }
        
        #mainView { height: 100%; display: flex; flex-direction: column; }
        .main-container { flex: 1; display: flex; overflow: hidden; min-height: 0; }
        .stream-area { flex: 1; display: flex; flex-direction: column; overflow: hidden; min-width: 0; }
        
        .stream-canvas-wrapper {
            position: relative;
            flex: 1;
            background: black;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 0;
        }
        
        .stream-canvas-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }
        
        .side-panel {
            width: 340px;
            background: #0f172a;
            border-left: 1px solid #1e293b;
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            overflow: hidden;
        }
        
        @media (max-width: 900px) {
            .side-panel {
                position: fixed !important;
                right: 0; top: 0; bottom: 0;
                width: 85% !important;
                max-width: 340px;
                z-index: 100;
                box-shadow: -4px 0 20px rgba(0,0,0,0.5);
            }
            .side-panel.closed { width: 0 !important; }
            .stream-canvas-wrapper { min-height: 60vh !important; }
            .top-bar {
                flex-wrap: wrap;
                padding: 6px 10px !important;
                height: auto !important;
                min-height: 48px;
            }
            .top-bar > div:first-child { flex: 1; min-width: 0; }
            .top-bar .target-info {
                font-size: 10px !important;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
            }
            .top-bar .btn-group { gap: 4px !important; }
            .top-bar button {
                font-size: 9px !important;
                padding: 4px 8px !important;
                white-space: nowrap;
            }
            .realtime-bar {
                max-width: 98% !important;
                padding: 6px 8px !important;
                border-radius: 14px !important;
                gap: 4px !important;
            }
            .realtime-bar input {
                width: 100% !important;
                font-size: 11px !important;
                padding: 8px 10px !important;
            }
            .realtime-bar button {
                font-size: 9px !important;
                padding: 4px 6px !important;
            }
        }
        
        @media (max-width: 480px) {
            .top-bar { padding: 4px 8px !important; }
            .top-bar button { font-size: 8px !important; padding: 3px 6px !important; }
            .realtime-bar { flex-wrap: wrap; justify-content: center; }
            .realtime-bar input { min-width: 100px; }
        }
        
        .side-panel-content::-webkit-scrollbar { width: 4px; }
        .side-panel-content::-webkit-scrollbar-track { background: #1e293b; }
        .side-panel-content::-webkit-scrollbar-thumb { background: #475569; border-radius: 4px; }
        
        .mic-btn-active {
            background: #ef4444 !important;
            animation: pulse-mic 1.2s infinite;
        }
        @keyframes pulse-mic {
            0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.5); }
            70% { box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); }
            100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 antialiased">

    <div id="statusBanner" class="fixed inset-0 z-50 bg-slate-950 flex items-center justify-center p-8">
        <div class="max-w-lg w-full text-center">
            <div class="text-4xl mb-5 opacity-60">🦈</div>
            <h1 id="statusTitle" class="text-lg font-bold text-slate-200 mb-2">Connecting…</h1>
            <p  id="statusMessage" class="text-sm text-slate-500 mb-5">Establishing session with the remote agent.</p>
            <div id="statusHwid" class="text-[11px] font-mono text-slate-500 break-all bg-slate-900 border border-slate-800 rounded-xl px-3 py-2 mb-5 hidden"></div>
            <div id="statusRetry" class="hidden">
                <button onclick="location.reload()"
                        class="text-xs font-semibold text-blue-400 hover:text-blue-300 bg-slate-900 border border-slate-800 px-3 py-1.5 rounded-lg transition">
                    ↻ Retry
                </button>
            </div>
        </div>
    </div>

    <div id="mainView" class="hidden">
        <div class="top-bar h-12 bg-slate-900 border-b border-slate-800 flex items-center justify-between px-5 flex-shrink-0">
            <div class="flex items-center space-x-2 sm:space-x-3 min-w-0">
                <div class="text-[10px] sm:text-xs text-slate-400 target-info truncate">
                    <span id="targetName" class="font-bold text-white">—</span>
                    <span id="targetResolution" class="text-slate-500 ml-1 sm:ml-2"></span>
                </div>
                <button onclick="copyShareLink(this)"
                        class="text-[9px] sm:text-[10px] font-semibold text-slate-400 hover:text-white bg-slate-800 hover:bg-slate-700 px-1.5 sm:px-2 py-1 rounded transition flex-shrink-0">
                    🔗 <span class="hidden sm:inline">Copy</span>
                </button>
            </div>
            <div class="flex items-center space-x-1 sm:space-x-3 btn-group flex-shrink-0">
                <div class="flex items-center space-x-1 sm:space-x-2">
                    <span id="liveDot" class="w-1.5 h-1.5 rounded-full bg-slate-600"></span>
                    <span id="liveLabel" class="text-[9px] sm:text-[11px] font-medium text-slate-500">Idle</span>
                </div>
                <button id="captureBtn" onclick="toggleCapture()"
                        class="text-[9px] sm:text-[11px] font-semibold bg-emerald-600 hover:bg-emerald-500 text-white px-2 sm:px-3 py-1 sm:py-1.5 rounded-lg transition">
                    ▶ <span class="hidden sm:inline">Start</span>
                </button>
                <button onclick="toggleSidePanel()"
                        class="text-[9px] sm:text-[11px] font-semibold text-slate-300 hover:text-white bg-slate-800 hover:bg-slate-700 px-2 sm:px-3 py-1 sm:py-1.5 rounded-lg transition">
                    ⚙ <span class="hidden sm:inline">Controls</span>
                </button>
            </div>
        </div>

        <div class="main-container">
            <div class="stream-area">
                <div id="streamCanvasWrapper"
                     class="stream-canvas-wrapper relative bg-black overflow-hidden flex items-center justify-center cursor-crosshair select-none">
                    <img id="liveStreamImg"
                         class="w-full h-full object-contain pointer-events-auto"
                         src="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIxIiBoZWlnaHQ9IjEiPjwvc3ZnPg=="/>
                    <div id="clickMarker" class="absolute w-4 h-4 pointer-events-none transition-all duration-75 flex items-start justify-start hidden z-20">
                        <span class="absolute -top-1.5 -left-1.5 w-6 h-6 rounded-full bg-blue-500/30 animate-ping"></span>
                        <span class="w-3 h-3 rounded-full bg-[#0066FF] border-2 border-white shadow-md"></span>
                    </div>
                    <div id="ghostOverlayText"
                         class="absolute pointer-events-none select-none whitespace-pre leading-none hidden z-10 font-sans font-normal m-0 p-0"></div>
                    <div id="streamPlaceholder"
                         class="absolute inset-0 flex items-center justify-center text-slate-500 text-xs bg-slate-950/70 pointer-events-none z-10 text-center px-4">
                        Click "Start capture" to begin streaming
                    </div>
                    <div class="absolute bottom-3 sm:bottom-4 left-1/2 -translate-x-1/2 flex items-center gap-1 sm:gap-2 bg-slate-900/90 backdrop-blur-sm border border-slate-700 rounded-2xl px-2 sm:px-3 py-1.5 sm:py-2 z-30 shadow-2xl max-w-[98%] sm:max-w-[90%] realtime-bar">
                        <input type="text" id="realtimeInput" placeholder="Type or speak…"
                               class="w-40 sm:w-64 md:w-80 bg-slate-800 border border-slate-700 rounded-xl px-2 sm:px-3 py-1.5 sm:py-2 text-[11px] sm:text-xs text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-blue-500"/>
                        <button onclick="toggleVoiceInput()" id="voiceBtn"
                                class="text-[11px] sm:text-[13px] text-slate-300 hover:text-white px-1.5 sm:px-2 py-1 rounded-lg transition bg-slate-800 hover:bg-slate-700 flex-shrink-0"
                                title="Voice to text">
                            🎤
                        </button>
                        <button onclick="clearRealtime()" class="text-[10px] sm:text-[11px] text-rose-400 hover:text-rose-300 px-1 sm:px-2 flex-shrink-0">Clear</button>
                        <div class="w-px h-5 sm:h-6 bg-slate-700 hidden sm:block"></div>
                        <button onclick="toggleInWindowFullscreen()"
                                class="text-[10px] sm:text-[11px] font-semibold text-slate-300 hover:text-white px-1 sm:px-2 flex-shrink-0">
                            <span id="fullscreenBtnText">⛶</span>
                        </button>
                    </div>
                </div>
            </div>

            <aside id="sidePanel" class="side-panel">
                <div class="h-10 border-b border-slate-800 flex items-center justify-between px-4 flex-shrink-0">
                    <span class="text-[11px] font-bold text-slate-300 uppercase tracking-wider">Controls</span>
                    <button onclick="toggleSidePanel()" class="text-slate-500 hover:text-white text-sm">✕</button>
                </div>
                <div class="flex-1 overflow-y-auto p-4 space-y-5 text-slate-200 side-panel-content">
                    <div class="space-y-3">
                        <h3 class="text-[11px] font-bold uppercase tracking-wider text-slate-500">🖥 Display & Position</h3>
                        <div>
                            <label class="block text-[10px] font-semibold text-slate-400 mb-1">Display</label>
                            <select id="screenSelect" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-2.5 py-1.5 text-xs text-white">
                                <option value="0">Display 1</option>
                            </select>
                        </div>
                        <div class="grid grid-cols-2 gap-2">
                            <div>
                                <span class="text-[10px] text-slate-500">X (px)</span>
                                <input type="number" id="posX" value="960"
                                       class="w-full bg-slate-800 border border-slate-700 rounded-lg px-2.5 py-1.5 text-xs text-white"/>
                            </div>
                            <div>
                                <span class="text-[10px] text-slate-500">Y (px)</span>
                                <input type="number" id="posY" value="432"
                                       class="w-full bg-slate-800 border border-slate-700 rounded-lg px-2.5 py-1.5 text-xs text-white"/>
                            </div>
                        </div>
                        <p class="text-[10px] text-slate-500 leading-relaxed">
                            Click anywhere on the stream to place the marker.
                        </p>
                    </div>

                    <div class="space-y-3 pt-3 border-t border-slate-800">
                        <h3 class="text-[11px] font-bold uppercase tracking-wider text-slate-500">🖊 Style</h3>
                        <div>
                            <label class="block text-[10px] font-semibold text-slate-400 mb-1">Font size (px)</label>
                            <input type="number" id="fontSize" value="18"
                                   class="w-full bg-slate-800 border border-slate-700 rounded-lg px-2.5 py-1.5 text-xs text-white"/>
                        </div>
                        <div>
                            <label class="block text-[10px] font-semibold text-slate-400 mb-1">Color</label>
                            <div class="flex items-center space-x-2">
                                <input type="color" id="fontColor" value="#EFEFEF"
                                       class="w-8 h-8 rounded-lg border border-slate-700 p-0.5 cursor-pointer bg-slate-800"/>
                                <span id="colorHexText" class="text-[11px] font-mono text-slate-400">#EFEFEF</span>
                            </div>
                        </div>
                        <div>
                            <label class="text-[10px] font-semibold text-slate-400">
                                Opacity: <span id="opacityDisplay" class="font-bold text-white">100%</span>
                            </label>
                            <input type="range" id="fontOpacity" min="5" max="100" value="100"
                                   class="w-full mt-1 h-1 bg-slate-700 rounded-lg appearance-none cursor-pointer accent-[#0066FF]"/>
                        </div>
                    </div>

                    <div class="space-y-3 pt-3 border-t border-slate-800">
                        <h3 class="text-[11px] font-bold uppercase tracking-wider text-slate-500">✍ Manual message</h3>
                        <textarea id="draftText" rows="3" placeholder="Compose a message…"
                                  class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2 text-xs text-white focus:outline-none focus:ring-2 focus:ring-blue-500 resize-none"></textarea>
                        <div class="flex space-x-2">
                            <button onclick="sendDraft('update')"
                                    class="flex-1 bg-[#0066FF] hover:bg-blue-700 text-white text-[11px] font-semibold py-1.5 rounded-lg transition">
                                Send
                            </button>
                            <button onclick="sendDraft('clear')"
                                    class="px-2.5 bg-rose-900/40 hover:bg-rose-900/60 text-rose-300 border border-rose-800 text-[11px] font-semibold py-1.5 rounded-lg transition">
                                Clear
                            </button>
                        </div>
                        <button onclick="clearDraft()" class="w-full text-[11px] text-slate-500 hover:text-slate-300 py-1">Reset draft</button>
                    </div>
                </div>
            </aside>
        </div>
    </div>

    <script>
        // ═══════════════════════════════════════════════
        // URL params
        // ═══════════════════════════════════════════════
        const params    = new URLSearchParams(location.search);
        const HWID      = params.get('hwid');
        const URL_TOKEN = params.get('t');

        if (URL_TOKEN) {
            try { sessionStorage.setItem('sharkmind_token', URL_TOKEN); } catch (_) {}
        }

        const TOKEN = sessionStorage.getItem('sharkmind_token') || URL_TOKEN || '';

        const statusBanner   = document.getElementById('statusBanner');
        const mainView       = document.getElementById('mainView');
        const statusTitleEl  = document.getElementById('statusTitle');
        const statusMsgEl    = document.getElementById('statusMessage');
        const statusHwidEl   = document.getElementById('statusHwid');
        const statusRetryEl  = document.getElementById('statusRetry');

        function showStatus(title, message, showRetry) {
            statusTitleEl.textContent = title;
            statusMsgEl.textContent   = message;
            statusBanner.classList.remove('hidden');
            mainView.classList.add('hidden');
            mainView.classList.remove('flex');
            if (showRetry) statusRetryEl.classList.remove('hidden');
            else           statusRetryEl.classList.add('hidden');
        }

        if (!HWID) {
            showStatus('Invalid link', 'This link is missing its device identifier.', false);
            statusHwidEl.classList.add('hidden');
        } else {
            statusHwidEl.textContent = HWID;
            statusHwidEl.classList.remove('hidden');
            showStatus('Connecting…', 'Establishing session with the remote agent.', false);
        }

        // ═══════════════════════════════════════════════
        // Mobile detection
        // ═══════════════════════════════════════════════
        const isMobile = /Android|iPhone|iPad|iPod|Mobile|webOS|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
        const isIOS = /iPhone|iPad|iPod/i.test(navigator.userAgent);
        const isAndroid = /Android/i.test(navigator.userAgent);
        console.log('[voice] Mobile:', isMobile, 'iOS:', isIOS, 'Android:', isAndroid);

        // ═══════════════════════════════════════════════
        // Socket
        // ═══════════════════════════════════════════════
        const SOCKET_URL  = window.SHARKMIND?.SOCKET_URL || 'http://localhost:3000';
        const SOCKET_PATH = window.SHARKMIND?.SOCKET_PATH || '/socket.io';

        const socket = io(SOCKET_URL, {
            path: SOCKET_PATH,
            transports: ['websocket'],
            auth: TOKEN ? { token: TOKEN } : {},
            reconnection: true,
            reconnectionDelay: 500,
            reconnectionDelayMax: 3000,
            reconnectionAttempts: Infinity,
            timeout: 10000
        });

        // ═══════════════════════════════════════════════
        // State
        // ═══════════════════════════════════════════════
        let target = null;
        let previousBlobUrl = null;
        let currentScreenWidth = 1920;
        let currentScreenHeight = 1080;
        let cachedScreens = [];
        let activeGhostText = '';
        let sidePanelOpen = true;
        let captureEnabled = false;
        let userPaused = false;
        let resolved = false;
        let joined = false;

        const streamWrapper    = document.getElementById('streamCanvasWrapper');
        const streamImg        = document.getElementById('liveStreamImg');
        const clickMarker      = document.getElementById('clickMarker');
        const ghostOverlay     = document.getElementById('ghostOverlayText');
        const posXInput        = document.getElementById('posX');
        const posYInput        = document.getElementById('posY');
        const fontSizeInput    = document.getElementById('fontSize');
        const fontColorInput   = document.getElementById('fontColor');
        const fontOpacityInput = document.getElementById('fontOpacity');
        const rtInput          = document.getElementById('realtimeInput');

        // ═══════════════════════════════════════════════
        // Socket connect / auth
        // ═══════════════════════════════════════════════
        function joinAsOperator() {
            socket.emit('join_operator', TOKEN ? { token: TOKEN } : { public: true });
        }

        socket.on('connect', () => {
            joined = false;
            joinAsOperator();
            if (target && !userPaused) {
                socket.emit('set_capture', { targetUsername: target, enabled: true });
                if (activeGhostText) sendPayload('update', activeGhostText);
            }
        });

        socket.on('auth_ok', () => { joined = true; });
        socket.on('auth_error', () => { joined = false; socket.emit('join_operator', { public: true }); });
        socket.on('connect_error', (e) => console.error('[agent] connect_error:', e.message));
        socket.on('disconnect', () => {
            joined = false;
            if (!resolved) showStatus('Connection lost', 'The link to the agent was interrupted.', true);
        });

        // ═══════════════════════════════════════════════
        // Button states
        // ═══════════════════════════════════════════════
        function setCaptureButtonIdle() {
            const b = document.getElementById('captureBtn');
            b.innerHTML = '▶ <span class="hidden sm:inline">Start capture</span><span class="sm:hidden">Start</span>';
            b.className = 'text-[9px] sm:text-[11px] font-semibold bg-emerald-600 hover:bg-emerald-500 text-white px-2 sm:px-3 py-1 sm:py-1.5 rounded-lg transition';
            const dot = document.getElementById('liveDot');
            const lbl = document.getElementById('liveLabel');
            dot.className = 'w-1.5 h-1.5 rounded-full bg-slate-600';
            lbl.textContent = 'Idle';
            lbl.className = 'text-[9px] sm:text-[11px] font-medium text-slate-500';
        }
        function setCaptureButtonActive() {
            const b = document.getElementById('captureBtn');
            b.innerHTML = '⏸ <span class="hidden sm:inline">Pause capture</span><span class="sm:hidden">Pause</span>';
            b.className = 'text-[9px] sm:text-[11px] font-semibold bg-rose-600 hover:bg-rose-500 text-white px-2 sm:px-3 py-1 sm:py-1.5 rounded-lg transition';
            const dot = document.getElementById('liveDot');
            const lbl = document.getElementById('liveLabel');
            dot.className = 'w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse';
            lbl.textContent = 'Live';
            lbl.className = 'text-[9px] sm:text-[11px] font-medium text-emerald-400';
        }
        function setCaptureButtonWaiting() {
            const dot = document.getElementById('liveDot');
            const lbl = document.getElementById('liveLabel');
            dot.className = 'w-1.5 h-1.5 rounded-full bg-amber-500';
            lbl.textContent = 'Waiting…';
            lbl.className = 'text-[9px] sm:text-[11px] font-medium text-amber-400';
        }

        // ═══════════════════════════════════════════════
        // Input listeners
        // ═══════════════════════════════════════════════
        fontColorInput.addEventListener('input', (e) => {
            document.getElementById('colorHexText').textContent = e.target.value.toUpperCase();
            updateGhostOverlay();
        });
        fontOpacityInput.addEventListener('input', (e) => {
            document.getElementById('opacityDisplay').textContent = `${e.target.value}%`;
            updateGhostOverlay();
        });
        fontSizeInput.addEventListener('input', updateGhostOverlay);
        posXInput.addEventListener('input', () => { updateMarkerAndGhostFromInputs(); if (activeGhostText) sendPayload('update', activeGhostText); });
        posYInput.addEventListener('input', () => { updateMarkerAndGhostFromInputs(); if (activeGhostText) sendPayload('update', activeGhostText); });

        function toggleSidePanel() {
            sidePanelOpen = !sidePanelOpen;
            document.getElementById('sidePanel').classList.toggle('closed', !sidePanelOpen);
            setTimeout(updateMarkerAndGhostFromInputs, 220);
        }

        // ═══════════════════════════════════════════════
        // Agent list
        // ═══════════════════════════════════════════════
        socket.on('agents_updated', (agents) => {
            if (!HWID) return;
            const list = Array.isArray(agents) ? agents : [];
            const match = list.find(a => a.username === HWID) || list.find(a => a.username.startsWith(HWID));

            if (!match) {
                if (!resolved) {
                    showStatus('Device not found', 'No agent has ever connected with this identifier.', true);
                    statusHwidEl.classList.remove('hidden');
                }
                return;
            }

            if (!match.online) {
                if (!resolved) {
                    showStatus('Device is offline', 'The agent exists but is not currently connected.', true);
                    statusHwidEl.textContent = match.username;
                    statusHwidEl.classList.remove('hidden');
                } else {
                    setCaptureButtonWaiting();
                    document.getElementById('streamPlaceholder').textContent = 'Agent offline — waiting for it to reconnect…';
                    document.getElementById('streamPlaceholder').classList.remove('hidden');
                }
                return;
            }

            const firstTime = !resolved;
            resolved = true;
            if (firstTime) {
                statusBanner.classList.add('hidden');
                mainView.classList.remove('hidden');
                mainView.classList.add('flex');
            }

            if (target !== match.username) {
                target = match.username;
                captureEnabled = false;
                userPaused = false;
                setCaptureButtonIdle();
                document.getElementById('targetName').textContent = match.systemName || match.username;
                if (match.display && match.display.width && match.display.height) {
                    currentScreenWidth  = match.display.width;
                    currentScreenHeight = match.display.height;
                    const sf = match.display.scaleFactor || 1;
                    const physW = Math.round(match.display.width  * sf);
                    const physH = Math.round(match.display.height * sf);
                    document.getElementById('targetResolution').textContent =
                        sf === 1 ? `(${match.display.width}×${match.display.height})`
                                 : `(${match.display.width}×${match.display.height} @ ${Math.round(sf*100)}% → ${physW}×${physH})`;
                }
                document.getElementById('streamPlaceholder').textContent = 'Click "Start capture" to begin streaming';
                document.getElementById('streamPlaceholder').classList.remove('hidden');
                setTimeout(updateMarkerAndGhostFromInputs, 100);
            } else if (captureEnabled && !userPaused) {
                socket.emit('set_capture', { targetUsername: target, enabled: true });
                setCaptureButtonActive();
            }
        });

        // ═══════════════════════════════════════════════
        // Capture toggle
        // ═══════════════════════════════════════════════
        function toggleCapture() {
            if (!target) return;
            if (!joined) { joinAsOperator(); setTimeout(doToggleCapture, 300); return; }
            doToggleCapture();
        }

        function doToggleCapture() {
            captureEnabled = !captureEnabled;
            userPaused = !captureEnabled;
            if (captureEnabled) {
                setCaptureButtonActive();
                socket.emit('set_capture', { targetUsername: target, enabled: true });
            } else {
                setCaptureButtonIdle();
                socket.emit('set_capture', { targetUsername: target, enabled: false });
                clearLive();
            }
        }

        // ═══════════════════════════════════════════════
        // Live frames
        // ═══════════════════════════════════════════════
        socket.on('screen_stream', (data) => {
            if (!target || data.username !== target) return;
            if (!captureEnabled) return;

            document.getElementById('streamPlaceholder').classList.add('hidden');

            if (data.meta) {
                try {
                    const metaObj = typeof data.meta === 'string' ? JSON.parse(data.meta) : data.meta;
                    if (metaObj.screenWidth)  currentScreenWidth  = metaObj.screenWidth;
                    if (metaObj.screenHeight) currentScreenHeight = metaObj.screenHeight;
                    if (metaObj.screens && Array.isArray(metaObj.screens)) {
                        const newJson = JSON.stringify(metaObj.screens);
                        if (JSON.stringify(cachedScreens) !== newJson) {
                            cachedScreens = metaObj.screens;
                            const select = document.getElementById('screenSelect');
                            select.innerHTML = '';
                            metaObj.screens.forEach(s => {
                                const opt = document.createElement('option');
                                opt.value = s.index;
                                opt.textContent = s.name || `Display ${s.index + 1} (${s.width}x${s.height})`;
                                if (s.index == metaObj.screenIndex) opt.selected = true;
                                select.appendChild(opt);
                            });
                        }
                    }
                } catch (e) {}
            }

            const blob = new Blob([data.buffer], { type: 'image/jpeg' });
            const url  = URL.createObjectURL(blob);
            streamImg.onload = () => {
                if (previousBlobUrl && previousBlobUrl !== url) URL.revokeObjectURL(previousBlobUrl);
                previousBlobUrl = url;
                updateMarkerAndGhostFromInputs();
            };
            streamImg.src = url;
        });

        document.getElementById('screenSelect').addEventListener('change', function () {
            if (!target) return;
            socket.emit('send_overlay_action', {
                targetUsername: target,
                payload: { action: 'switch_screen', screenIndex: parseInt(this.value) }
            });
        });

        // ═══════════════════════════════════════════════
        // Positioning & overlay
        // ═══════════════════════════════════════════════
        function getDisplayedImageMetrics() {
            const wrapRect = streamWrapper.getBoundingClientRect();
            const wrapperW = wrapRect.width;
            const wrapperH = wrapRect.height;
            const targetAspect  = currentScreenWidth / currentScreenHeight;
            const wrapperAspect = wrapperW / wrapperH;
            let renderW, renderH, offsetX, offsetY;
            if (wrapperAspect > targetAspect) {
                renderH = wrapperH;
                renderW = wrapperH * targetAspect;
                offsetX = (wrapperW - renderW) / 2;
                offsetY = 0;
            } else {
                renderW = wrapperW;
                renderH = wrapperW / targetAspect;
                offsetX = 0;
                offsetY = (wrapperH - renderH) / 2;
            }
            return { wrapperW, wrapperH, renderW, renderH, offsetX, offsetY };
        }

        streamImg.addEventListener('click', (e) => {
            const wrapRect = streamWrapper.getBoundingClientRect();
            const clickWrapX = e.clientX - wrapRect.left;
            const clickWrapY = e.clientY - wrapRect.top;
            const m = getDisplayedImageMetrics();
            if (clickWrapX < m.offsetX || clickWrapX > m.offsetX + m.renderW ||
                clickWrapY < m.offsetY || clickWrapY > m.offsetY + m.renderH) return;
            const imgX = clickWrapX - m.offsetX;
            const imgY = clickWrapY - m.offsetY;
            const relX = Math.round((imgX / m.renderW) * currentScreenWidth);
            const relY = Math.round((imgY / m.renderH) * currentScreenHeight);
            posXInput.value = Math.max(0, Math.min(currentScreenWidth,  relX));
            posYInput.value = Math.max(0, Math.min(currentScreenHeight, relY));
            updateMarkerAndGhostFromInputs();
            if (activeGhostText) sendPayload('update', activeGhostText);
        });

        function updateMarkerAndGhostFromInputs() {
            const relX = parseInt(posXInput.value) || 0;
            const relY = parseInt(posYInput.value) || 0;
            const m = getDisplayedImageMetrics();
            if (!m.renderW || !m.renderH) return;
            const domX = m.offsetX + (relX / currentScreenWidth)  * m.renderW;
            const domY = m.offsetY + (relY / currentScreenHeight) * m.renderH;
            clickMarker.style.left = `${domX}px`;
            clickMarker.style.top  = `${domY}px`;
            clickMarker.classList.remove('hidden');
            ghostOverlay.style.left = `${domX}px`;
            ghostOverlay.style.top  = `${domY}px`;
            updateGhostOverlay();
        }

        function updateGhostOverlay() {
            if (!activeGhostText || !activeGhostText.trim()) {
                ghostOverlay.classList.add('hidden');
                ghostOverlay.textContent = '';
                return;
            }
            const m = getDisplayedImageMetrics();
            const scaleRatio = m.renderW / (currentScreenWidth || 1920);
            const baseFontSize = parseInt(fontSizeInput.value) || 18;
            const scaledFontSize = Math.max(8, baseFontSize * scaleRatio);
            ghostOverlay.style.fontSize = `${scaledFontSize}px`;
            ghostOverlay.style.color    = fontColorInput.value;
            ghostOverlay.style.opacity  = (parseInt(fontOpacityInput.value) || 25) / 100.0;
            ghostOverlay.textContent    = activeGhostText;
            ghostOverlay.classList.remove('hidden');
        }

        // ═══════════════════════════════════════════════
        // Realtime / draft input
        // ═══════════════════════════════════════════════
        rtInput.addEventListener('input', () => {
            if (!target) return;
            activeGhostText = rtInput.value;
            if (activeGhostText.length > 0) sendPayload('update', activeGhostText);
            else sendPayload('clear', '');
            updateMarkerAndGhostFromInputs();
        });

        function clearRealtime() {
            rtInput.value = '';
            activeGhostText = '';
            sendPayload('clear', '');
            updateMarkerAndGhostFromInputs();
        }

        function sendDraft(action) {
            const text = document.getElementById('draftText').value;
            activeGhostText = action === 'update' ? text : '';
            sendPayload(action, text);
            updateMarkerAndGhostFromInputs();
        }
        function clearDraft() {
            document.getElementById('draftText').value = '';
            activeGhostText = '';
            sendPayload('clear', '');
            updateMarkerAndGhostFromInputs();
        }

        function sendPayload(action, text) {
            if (!target) return;
            if (!joined) joinAsOperator();
            const screenIndex = parseInt(document.getElementById('screenSelect').value) || 0;
            socket.emit('send_overlay_action', {
                targetUsername: target,
                payload: {
                    action, text, screenIndex,
                    x:        parseInt(posXInput.value)         || 0,
                    y:        parseInt(posYInput.value)         || 0,
                    fontSize: parseInt(fontSizeInput.value)     || 18,
                    color:    fontColorInput.value,
                    opacity:  (parseInt(fontOpacityInput.value) || 25) / 100.0
                }
            });
        }

        function clearLive() {
            streamImg.src = "data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIxIiBoZWlnaHQ9IjEiPjwvc3ZnPg==";
            document.getElementById('streamPlaceholder').textContent = 'Click "Start capture" to begin streaming';
            document.getElementById('streamPlaceholder').classList.remove('hidden');
            clickMarker.classList.add('hidden');
            ghostOverlay.classList.add('hidden');
            if (previousBlobUrl) { URL.revokeObjectURL(previousBlobUrl); previousBlobUrl = null; }
        }

        // ═══════════════════════════════════════════════
        // Voice-to-Text — MOBILE-AWARE
        //
        // Mobile (especially Android Chrome) sends the ENTIRE
        // transcript on every event instead of just new chunks.
        // iOS Safari doesn't support `continuous` well.
        //
        // Strategy: use a DEDUPE pass. Keep the last committed
        // text and only append what's genuinely new. If mobile
        // sends the full transcript, we detect and skip the
        // already-seen prefix.
        // ═══════════════════════════════════════════════
        let recognition = null;
        let isListening = false;
        let voiceBaseText = '';         // frozen input when mic started
        let voiceCommittedText = '';    // all finalized text so far (single source of truth)
        let voiceLastFinalFromEvent = ''; // for mobile dedupe: full text seen last event
        let restarting = false;

        function createRecognition() {
            const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SR) return null;

            const rec = new SR();
            // On mobile, `continuous = true` is unreliable; we still set it
            // because Android honors it, and iOS ignores it gracefully.
            rec.continuous = true;
            rec.interimResults = true;
            rec.lang = 'en-US';
            rec.maxAlternatives = 1;

            rec.onstart = () => {
                isListening = true;
                restarting = false;
                const btn = document.getElementById('voiceBtn');
                btn.classList.add('mic-btn-active');
                btn.innerHTML = '🔴';
                btn.title = 'Stop listening';
            };

            rec.onresult = (e) => {
                let interim = '';
                let newFinal = '';

                // Collect everything the browser gave us in this event
                for (let i = e.resultIndex; i < e.results.length; i++) {
                    const t = e.results[i][0].transcript;
                    if (e.results[i].isFinal) newFinal += t;
                    else interim += t;
                }

                // MOBILE DEDUPE:
                // Android Chrome often sends the ENTIRE accumulated final
                // transcript on each final result instead of just the delta.
                // If the new final starts with (or equals) what we already
                // committed, only keep the genuinely new suffix.
                if (newFinal) {
                    const trimmedNew = newFinal.trim();
                    const committedLower = voiceCommittedText.toLowerCase();
                    const newLower = trimmedNew.toLowerCase();

                    if (newLower === committedLower) {
                        // Exact duplicate → ignore entirely
                        newFinal = '';
                    } else if (newLower.startsWith(committedLower) && committedLower.length > 0) {
                        // New final contains the old committed text as a prefix
                        // → only keep the delta
                        newFinal = trimmedNew.substring(voiceCommittedText.length).trim();
                    } else if (committedLower.startsWith(newLower) && newLower.length > 0) {
                        // We somehow have more than what the API reports → ignore
                        newFinal = '';
                    }
                    // else: it's genuinely new, keep as-is
                }

                if (newFinal) {
                    voiceCommittedText = (voiceCommittedText + ' ' + newFinal)
                        .replace(/\s+/g, ' ').trim();
                }

                // Rebuild display from frozen base + committed + interim
                let display = voiceBaseText;
                if (voiceCommittedText) display += (display ? ' ' : '') + voiceCommittedText;
                if (interim) display += (display ? ' ' : '') + interim.trim();

                rtInput.value = display;
                rtInput.dispatchEvent(new Event('input', { bubbles: true }));
            };

            rec.onerror = (e) => {
                console.warn('[voice] error:', e.error);
                if (e.error === 'not-allowed' || e.error === 'service-not-allowed') {
                    alert('Microphone access denied. Please allow microphone permissions in your browser settings.');
                    stopVoiceInput();
                } else if (e.error === 'audio-capture') {
                    alert('No microphone found on this device.');
                    stopVoiceInput();
                } else if (e.error === 'network') {
                    alert('Speech recognition needs an internet connection.');
                    stopVoiceInput();
                } else if (e.error === 'no-speech') {
                    // Silent, will auto-restart via onend
                }
            };

            rec.onend = () => {
                if (isListening && !restarting) {
                    restarting = true;
                    // Longer delay on mobile — gives the mic time to fully release
                    const delay = isMobile ? 350 : 150;
                    setTimeout(() => {
                        try { rec.start(); } catch (_) { restarting = false; }
                    }, delay);
                } else {
                    const btn = document.getElementById('voiceBtn');
                    btn.classList.remove('mic-btn-active');
                    btn.innerHTML = '🎤';
                    btn.title = 'Voice to text';
                    isListening = false;
                    restarting = false;
                }
            };

            return rec;
        }

        function toggleVoiceInput() {
            if (isListening) stopVoiceInput();
            else startVoiceInput();
        }

        function startVoiceInput() {
            if (!recognition) recognition = createRecognition();
            if (!recognition) {
                alert('Speech recognition is not supported on this browser.\n\nOn iPhone, please use Safari (iOS 14.5+).\nOn Android, please use Chrome.');
                return;
            }

            // Freeze the current input as the immutable base for this session
            voiceBaseText = rtInput.value.trim();
            voiceCommittedText = '';
            voiceLastFinalFromEvent = '';
            isListening = true;
            restarting = false;

            try {
                recognition.start();
            } catch (e) {
                console.warn('[voice] start failed:', e);
                isListening = false;
                // If it's already started, stop and retry
                try { recognition.stop(); } catch (_) {}
                setTimeout(() => {
                    try { recognition.start(); } catch (_) { isListening = false; }
                }, 200);
            }
        }

        function stopVoiceInput() {
            isListening = false;
            restarting = false;
            if (recognition) {
                try { recognition.stop(); } catch (_) {}
            }
            // Commit current input as new base so next session appends correctly
            voiceBaseText = rtInput.value.trim();
            voiceCommittedText = '';
            voiceLastFinalFromEvent = '';
            const btn = document.getElementById('voiceBtn');
            btn.classList.remove('mic-btn-active');
            btn.innerHTML = '🎤';
            btn.title = 'Voice to text';
        }

        // ═══════════════════════════════════════════════
        // Misc UI
        // ═══════════════════════════════════════════════
        function copyShareLink(btn) {
            navigator.clipboard.writeText(location.href).then(() => {
                const old = btn.innerHTML;
                btn.innerHTML = '✓ Copied';
                btn.classList.add('text-emerald-400');
                setTimeout(() => {
                    btn.innerHTML = old;
                    btn.classList.remove('text-emerald-400');
                }, 1200);
            }).catch(() => prompt('Link:', location.href));
        }

        function toggleInWindowFullscreen() {
            const isFull = streamWrapper.classList.toggle('in-window-fullscreen');
            document.getElementById('fullscreenBtnText').textContent = isFull ? '✕' : '⛶';
            setTimeout(updateMarkerAndGhostFromInputs, 60);
        }
        window.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && streamWrapper.classList.contains('in-window-fullscreen')) {
                toggleInWindowFullscreen();
            }
        });

        const resizeObserver = new ResizeObserver(() => updateMarkerAndGhostFromInputs());
        resizeObserver.observe(streamWrapper);

        // Pre-init voice recognition
        if (window.SpeechRecognition || window.webkitSpeechRecognition) {
            recognition = createRecognition();
        }

        function setViewportHeight() {
            document.documentElement.style.setProperty('--vh', `${window.innerHeight * 0.01}px`);
        }
        setViewportHeight();
        window.addEventListener('resize', setViewportHeight);
        window.addEventListener('orientationchange', () => setTimeout(setViewportHeight, 100));
    </script>
</body>
</html>
