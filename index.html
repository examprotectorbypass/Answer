<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Anwer On Screen</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:
    radial-gradient(circle at 0% 0%,#eef2ff 0,transparent 50%),
    radial-gradient(circle at 100% 100%,#f5eeff 0,transparent 50%),
    #f4f6fb;
  min-height:100vh;
  font-family:system-ui,-apple-system,'Segoe UI',sans-serif;
  color:#1a1a2e;
  padding:40px 16px;
  display:flex;
  justify-content:center;
  align-items:flex-start;
}
.box{
  width:100%;
  max-width:680px;
  background:#fff;
  border-radius:24px;
  padding:24px;
  box-shadow:
    0 0 0 1px rgba(20,20,50,.04),
    0 1px 3px rgba(20,20,50,.04),
    0 12px 28px rgba(20,20,50,.08),
    0 32px 80px rgba(20,20,50,.06);
}
.title{font-size:15px;font-weight:800;margin-bottom:2px;letter-spacing:-.2px}
.subtitle{font-size:11px;color:#8a93a4;font-weight:600;margin-bottom:16px}
label{display:block;font-size:10px;font-weight:800;text-transform:uppercase;
  letter-spacing:.08em;color:#8a93a4;margin-bottom:6px}

.switch-row{
  display:flex;align-items:center;justify-content:space-between;
  padding:12px 16px;background:#fafbfd;border:1.5px solid #e3e6ee;
  border-radius:14px;margin-bottom:14px;
  transition:background .25s,border-color .25s;
}
.switch-row.on{
  background:linear-gradient(135deg,#eef2ff,#e6ecff);
  border-color:#c8d2ff;
}
.switch-label{display:flex;align-items:center;gap:10px;
  font-size:13px;font-weight:800;color:#1a1a2e}
.switch-label .dot{width:10px;height:10px;border-radius:50%;
  background:#c8d2dd;transition:background .25s,box-shadow .25s;flex-shrink:0}
.switch-row.on .switch-label .dot{
  background:#667eea;box-shadow:0 0 0 4px rgba(102,126,234,.2)}
.switch-sub{font-size:10px;font-weight:600;color:#8a93a4;
  margin-top:2px;margin-left:20px}
.switch{position:relative;display:inline-block;width:54px;height:30px;flex-shrink:0}
.switch input{opacity:0;width:0;height:0;position:absolute}
.switch .slider{
  position:absolute;inset:0;background:#c8d2dd;border-radius:999px;
  cursor:pointer;transition:background .25s;
  box-shadow:inset 0 1px 3px rgba(0,0,0,.08);
}
.switch .slider::before{
  content:"";position:absolute;height:24px;width:24px;left:3px;top:3px;
  background:#fff;border-radius:50%;
  transition:transform .25s cubic-bezier(.4,0,.2,1);
  box-shadow:0 2px 6px rgba(0,0,0,.2);
}
.switch input:checked + .slider{background:linear-gradient(135deg,#667eea,#764ba2)}
.switch input:checked + .slider::before{transform:translateX(24px)}

.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:560px){.grid{grid-template-columns:1fr}}

.card{
  background:#fafbfd;border:1.5px solid #e3e6ee;border-radius:14px;
  padding:14px;display:flex;flex-direction:column;
}
.card .label-top{
  font-size:10px;font-weight:800;text-transform:uppercase;
  letter-spacing:.08em;color:#8a93a4;margin-bottom:8px}

.message-wrap{display:flex;gap:8px;align-items:stretch;flex:1}
textarea{
  flex:1;width:100%;font-size:13px;padding:10px 12px;
  border:1.5px solid #e3e6ee;border-radius:12px;outline:none;
  font-family:inherit;background:#fff;resize:none;min-height:120px;
  transition:border-color .18s,box-shadow .18s;line-height:1.5}
textarea:focus{border-color:#667eea;box-shadow:0 0 0 4px rgba(102,126,234,.12)}
textarea::placeholder{color:#a3acbb}
.btn-mic{
  width:44px;border-radius:12px;border:none;
  background:linear-gradient(135deg,#1a1a2e,#2a2a4e);color:#fff;
  display:inline-flex;align-items:center;justify-content:center;
  flex-shrink:0;padding:0;font-size:16px;cursor:pointer;
  box-shadow:0 6px 16px rgba(26,26,46,.3);
  transition:transform .12s,box-shadow .18s,background .2s}
.btn-mic:hover{transform:scale(1.04)}
.btn-mic:active{transform:scale(.94)}
.btn-mic.listening{
  background:linear-gradient(135deg,#ef476f,#d62839);
  animation:pulse 1.2s infinite}
@keyframes pulse{
  0%{box-shadow:0 0 0 0 rgba(239,71,111,.55)}
  70%{box-shadow:0 0 0 12px rgba(239,71,111,0)}
  100%{box-shadow:0 0 0 0 rgba(239,71,111,0)}}
.voice-status{font-size:11px;color:#8a93a4;min-height:14px;
  margin-top:6px;font-weight:600;transition:color .2s}
.voice-status.active{color:#ef476f;font-weight:700}

.hwid-pill{
  font-family:Consolas,monospace;font-size:10px;color:#5b6b7d;
  word-break:break-all;background:#fff;border:1.5px solid #e3e6ee;
  border-radius:12px;padding:9px 12px;line-height:1.4;
  display:flex;align-items:center}

.agent-row{display:flex;gap:8px;align-items:stretch}
.agent-row input{
  flex:1;min-width:0;font-size:13px;padding:9px 12px;
  border:1.5px solid #e3e6ee;border-radius:12px;outline:none;
  font-family:inherit;background:#fff;
  transition:border-color .18s,box-shadow .18s}
.agent-row input:focus{border-color:#667eea;box-shadow:0 0 0 4px rgba(102,126,234,.12)}
.agent-row input::placeholder{color:#a3acbb}
.btn-agent{
  padding:0 16px;border:none;border-radius:12px;
  background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;
  font-size:12px;font-weight:800;cursor:pointer;letter-spacing:.02em;
  flex-shrink:0;transition:transform .12s,box-shadow .18s,filter .15s;
  box-shadow:0 4px 12px rgba(102,126,234,.35)}
.btn-agent:hover{filter:brightness(1.08);box-shadow:0 6px 16px rgba(102,126,234,.45)}
.btn-agent:active{transform:scale(.97)}

.font-block{
  background:#fff;border:1.5px solid #e3e6ee;border-radius:12px;
  padding:10px 12px;margin-bottom:10px}
.font-header{display:flex;justify-content:space-between;
  align-items:center;margin-bottom:8px}
.font-header .lbl{font-size:10px;font-weight:800;text-transform:uppercase;
  letter-spacing:.08em;color:#8a93a4}
.font-val{font-size:12px;font-weight:800;color:#667eea;background:#eef2ff;
  padding:1px 9px;border-radius:999px;min-width:32px;text-align:center}
.font-row{display:flex;gap:8px;align-items:center}
.font-row button{
  width:28px;height:28px;padding:0;border-radius:8px;border:none;
  background:#fff;color:#1a1a2e;font-weight:800;font-size:14px;
  cursor:pointer;border:1.5px solid #e3e6ee;transition:all .12s;flex-shrink:0}
.font-row button:hover{background:#f4f6ff;border-color:#c8d2ff;color:#667eea}
.font-row button:active{transform:scale(.92)}
.font-row input[type=range]{
  flex:1;-webkit-appearance:none;appearance:none;height:6px;
  border-radius:6px;background:linear-gradient(90deg,#667eea,#764ba2);
  outline:none;cursor:pointer}
.font-row input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;width:18px;height:18px;border-radius:50%;
  background:#fff;cursor:pointer;border:3px solid #667eea;
  box-shadow:0 2px 8px rgba(102,126,234,.5)}
.font-row input[type=range]::-moz-range-thumb{
  width:18px;height:18px;border-radius:50%;background:#fff;
  cursor:pointer;border:3px solid #667eea;
  box-shadow:0 2px 8px rgba(102,126,234,.5)}

.btn-apply{
  width:100%;padding:9px;border:none;border-radius:10px;
  background:linear-gradient(135deg,#17b978,#0d9c62);color:#fff;
  font-size:12px;font-weight:800;cursor:pointer;letter-spacing:.02em;
  transition:transform .12s,box-shadow .18s,filter .15s;
  box-shadow:0 4px 12px rgba(23,185,120,.3)}
.btn-apply:hover{filter:brightness(1.08)}
.btn-apply:active{transform:scale(.98)}

.btn-reset{
  width:100%;padding:11px;border:none;border-radius:12px;
  background:linear-gradient(135deg,#ffb703,#fb8500);color:#4a3000;
  font-size:12px;font-weight:800;cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:6px;
  letter-spacing:.02em;transition:transform .12s,filter .15s;
  box-shadow:0 4px 12px rgba(255,183,3,.3)}
.btn-reset:hover{filter:brightness(1.06)}
.btn-reset:active{transform:scale(.98)}

.status{
  margin-top:14px;padding:9px 14px;border-radius:12px;
  font-size:12px;font-weight:700;text-align:center;
  background:#e6f9f1;color:#0f8f5a;min-height:34px;
  display:flex;align-items:center;justify-content:center;
  opacity:0;transition:opacity .25s,background .2s,color .2s}
.status.show{opacity:1}
.status.err{background:#fdeaef;color:#c8264a}

.tip{
  background:linear-gradient(135deg,#fff7e0,#fff1c8);
  border:1px solid #ffe1a8;color:#6b4a00;border-radius:12px;
  padding:9px 12px;font-size:11px;font-weight:600;
  margin-bottom:12px;line-height:1.5}
.tip code{background:rgba(0,0,0,.06);padding:1px 5px;border-radius:4px;font-size:10px}
</style>
</head>
<body>

<div class="box">

  <div class="title">Overlay Control</div>
  <div class="subtitle">Live typing · instant push</div>

  <div id="fileWarning" class="tip" style="display:none">
    ⚠️ Mic needs <code>http://localhost</code> or HTTPS.
  </div>

  <!-- ENABLE SWITCH -->
  <div id="enableRow" class="switch-row">
    <div>
      <div class="switch-label"><span class="dot"></span> Enable</div>
      <div class="switch-sub" id="enableSub">Off</div>
    </div>
    <label class="switch">
      <input type="checkbox" id="enableToggle">
      <span class="slider"></span>
    </label>
  </div>

  <!-- TWO COLUMN -->
  <div class="grid">

    <!-- LEFT -->
    <div class="card">
      <div class="label-top">Message</div>
      <div class="message-wrap">
        <textarea id="messageInput" placeholder="Start typing — the overlay updates live…"></textarea>
        <button id="adminVoiceBtn" class="btn-mic" title="Voice typing"><i class="bi bi-mic-fill"></i></button>
      </div>
      <div id="adminVoiceStatus" class="voice-status">🎤 Click mic to dictate</div>
    </div>

    <!-- RIGHT -->
    <div class="card">
      <div class="label-top">Hardware ID</div>
      <div class="hwid-pill" id="hwidDisplay" style="margin-bottom:12px">—</div>

      <div class="label-top">Agent</div>
      <div class="agent-row" style="margin-bottom:12px">
        <input type="text" id="agentInput" placeholder="i.exe">
        <button id="agentBtn" class="btn-agent">Set</button>
      </div>

      <div class="font-block">
        <div class="font-header">
          <span class="lbl">Font Size</span>
          <span id="fontSizeDisplay" class="font-val">16</span>
        </div>
        <div class="font-row">
          <button id="fontDecrease">−</button>
          <input type="range" id="fontSizeSlider" min="10" max="72" value="16">
          <button id="fontIncrease">+</button>
        </div>
      </div>

      <button id="applyFontBtn" class="btn-apply" style="margin-bottom:10px">Apply Font</button>

      <button id="resetPosBtn" class="btn-reset">
        <i class="bi bi-arrow-counterclockwise"></i> Reset Position
      </button>
    </div>

  </div>

  <div id="status" class="status"></div>
</div>

<script>
// ============================================================
// CONFIG
// ============================================================
const SUPABASE_URL = "https://rfjwotshbnhagelmzusx.supabase.co";
const API_KEY      = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJmandvdHNoYm5oYWdlbG16dXN4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjQxMjAyMjMsImV4cCI6MjA3OTY5NjIyM30.GNXNIwbYAO2ZZ16iVJIWC95Te3d_GwDCZw1qhpzko_M";
const TABLE        = "live_overlay";
const AGENT_PREFIX = "$77";              // auto-prepended to agent names
const REST_BASE    = `${SUPABASE_URL}/rest/v1/${TABLE}`;
// ============================================================

const $ = id => document.getElementById(id);
const params = new URLSearchParams(location.search);
const IS_FILE = location.protocol === 'file:';

let currentHwid = null;
let lastPushedText = null;
let inFlight = false;
let queuedText = null;
let isEnabled = false;
let currentAgent = `${AGENT_PREFIX}i.exe`;

let cachedPos = { x: 100, y: 100 };
let posLoaded = false;
let posCacheTime = 0;

// ---------- HTTP ----------
async function fastPatch(fields) {
  if (!currentHwid) return false;
  try {
    const res = await fetch(`${REST_BASE}?user_id=eq.${encodeURIComponent(currentHwid)}`, {
      method: 'PATCH',
      headers: {
        'apikey': API_KEY,
        'Authorization': `Bearer ${API_KEY}`,
        'Content-Type': 'application/json',
        'Prefer': 'return=minimal'
      },
      body: JSON.stringify(fields),
      keepalive: true
    });
    return res.ok;
  } catch { return false; }
}

async function upsertRow(fields) {
  if (!currentHwid) return false;
  try {
    const res = await fetch(REST_BASE, {
      method: 'POST',
      headers: {
        'apikey': API_KEY,
        'Authorization': `Bearer ${API_KEY}`,
        'Content-Type': 'application/json',
        'Prefer': 'resolution=merge-duplicates,return=minimal'
      },
      body: JSON.stringify({ user_id: currentHwid, ...fields })
    });
    return res.ok;
  } catch { return false; }
}

// ---------- Text push ----------
function pushText(text) {
  if (!isEnabled) return;
  queuedText = text;
  flushQueue();
}
async function flushQueue() {
  if (inFlight || queuedText === null) return;
  inFlight = true;
  const t = queuedText;
  queuedText = null;
  lastPushedText = t;
  await fastPatch({ live_text: t });
  inFlight = false;
  if (queuedText !== null) flushQueue();
}

// ---------- Status ----------
function status(msg, isErr = false) {
  const el = $("status");
  el.textContent = msg;
  el.className = 'status show' + (isErr ? ' err' : '');
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove('show'), 2200);
}

// ---------- Enable toggle ----------
async function setEnabled(on, skipPush = false) {
  isEnabled = on;
  $("enableToggle").checked = on;
  $("enableRow").classList.toggle('on', on);
  $("enableSub").textContent = on ? 'On' : 'Off';

  if (!currentHwid) return;
  if (skipPush) return;

  const ok = await fastPatch({
    is_active: on,
    live_text: on ? ($("messageInput").value || "") : ""
  });
  if (ok) status(on ? "Enable: ON" : "Enable: OFF");
  else    status("Failed to update state", true);
}

// ---------- Agent name normalization ----------
function normalizeAgentName(raw) {
  let v = (raw || '').trim();
  if (!v) return '';
  if (!/\.exe$/i.test(v)) v += '.exe';
  if (!v.startsWith(AGENT_PREFIX)) v = AGENT_PREFIX + v;
  return v;
}

// ---------- Agent ----------
async function setAgent(name) {
  if (!currentHwid) { status("No HWID", true); return; }
  const v = normalizeAgentName(name);
  if (!v) { status("Enter agent name", true); return; }
  const ok = await fastPatch({ agent: v });
  if (ok) {
    currentAgent = v;
    $("agentInput").value = v;
    status(`Agent set to ${v}`);
  } else {
    status("Failed to set agent", true);
  }
}

// ---------- Font ----------
async function applyFont(size) {
  if (!currentHwid) return;
  await fastPatch({ font_size: size });
  status(`Font size set to ${size}px`);
}

// ---------- Reset position ----------
async function resetPosition() {
  if (!currentHwid) return;
  const x = Math.max(Math.floor(window.innerWidth  / 2 - 200), 0);
  const y = Math.max(Math.floor(window.innerHeight / 2 - 100), 0);
  cachedPos = { x, y };
  posCacheTime = Date.now();
  posLoaded = true;
  await fastPatch({ pos_x: x, pos_y: y });
  status(`Position reset → (${x}, ${y})`);
}

// ============================================================
// VOICE — LIVE TRANSCRIPT
// ============================================================
let recognition = null;
let activeRec = null;
let recognitionTarget = null;

// Per-session state
let committedBase = '';    // text that existed before session started
let finalThisSession = ''; // phrases finalized during this session
let interim = '';          // live in-progress words

function setupVoice(targetId, statusId, btnId) {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) {
    $(statusId).textContent = "❌ Speech not supported in this browser";
    return null;
  }

  const rec = new SR();
  rec.continuous = true;
  rec.interimResults = true;
  rec.lang = 'en-US';
  rec.maxAlternatives = 1;

  rec.onstart = () => {
    $(btnId).classList.add('listening');
    $(statusId).textContent = "🎙️ Listening… speak now";
    $(statusId).classList.add('active');

    // snapshot current value as the committed base for this session
    committedBase = $(targetId).value || '';
    if (committedBase && !committedBase.endsWith(' ')) committedBase += ' ';
    finalThisSession = '';
    interim = '';
  };

  rec.onresult = e => {
    interim = '';
    for (let i = e.resultIndex; i < e.results.length; i++) {
      const transcript = e.results[i][0].transcript;
      if (e.results[i].isFinal) {
        finalThisSession += transcript + ' ';
      } else {
        interim += transcript;
      }
    }

    // rebuild the full textarea value: base + final-this-session + interim
    const live = (committedBase + finalThisSession + interim).replace(/\s+/g, ' ');
    const t = $(targetId);
    t.value = live;

    // keep caret at the end so it feels like live typing
    t.selectionStart = t.selectionEnd = t.value.length;

    // trigger pushText → live overlay update on every interim word
    t.dispatchEvent(new Event('input', { bubbles: true }));
  };

  rec.onerror = e => {
    if (e.error === 'no-speech') return;
    if (e.error === 'not-allowed' || e.error === 'service-not-allowed')
      $(statusId).textContent = "❌ Mic blocked — needs http:// or https://";
    else if (e.error === 'network')
      $(statusId).textContent = "❌ Network error";
    else
      $(statusId).textContent = "❌ " + e.error;
    stopVoice(btnId, statusId);
  };

  rec.onend = () => {
    if (activeRec === rec && recognition === rec) {
      // commit interim into base before restarting to avoid flicker
      committedBase = ($(targetId).value || '').replace(/\s+/g, ' ');
      if (committedBase && !committedBase.endsWith(' ')) committedBase += ' ';
      finalThisSession = '';
      interim = '';
      try { rec.start(); } catch {}
    } else {
      $(btnId).classList.remove('listening');
      $(statusId).classList.remove('active');
    }
  };

  return rec;
}

function startVoice(rec, targetId, statusId, btnId) {
  if (!rec) return;
  recognition = rec;
  activeRec = rec;
  recognitionTarget = targetId;
  try { rec.start(); } catch {}
}

function stopVoice(btnId, statusId) {
  if (recognition) { try { recognition.stop(); } catch {} }
  recognition = null;
  recognitionTarget = null;
  activeRec = null;
  if (btnId) $(btnId).classList.remove('listening');
  if (statusId) {
    $(statusId).textContent = "🎤 Click mic to dictate";
    $(statusId).classList.remove('active');
  }
}

// ---------- Auto-load HWID ----------
async function autoLoad(hwid) {
  if (!hwid) return;
  currentHwid = hwid;
  localStorage.setItem("hwid", hwid);
  $("hwidDisplay").textContent = hwid;

  try {
    const res = await fetch(
      `${REST_BASE}?user_id=eq.${encodeURIComponent(hwid)}&select=*`,
      { headers: { apikey: API_KEY, Authorization: `Bearer ${API_KEY}` } });
    const rows = await res.json();

    if (rows[0]) {
      $("messageInput").value = rows[0].live_text || "";
      $("fontSizeSlider").value = rows[0].font_size ?? 16;
      $("fontSizeDisplay").textContent = rows[0].font_size ?? 16;
      lastPushedText = rows[0].live_text || "";
      cachedPos = { x: rows[0].pos_x ?? 100, y: rows[0].pos_y ?? 100 };
      posLoaded = true;
      posCacheTime = Date.now();

      currentAgent = normalizeAgentName(rows[0].agent || 'i.exe');
      $("agentInput").value = currentAgent;

      await setEnabled(!!rows[0].is_active, true);
      status("Connected");
    } else {
      currentAgent = normalizeAgentName('i.exe');
      await upsertRow({
        live_text: "", font_size: 16, pos_x: 100, pos_y: 100,
        is_active: false, agent: currentAgent
      });
      $("agentInput").value = currentAgent;
      await setEnabled(false, true);
      status("Connected (new client)");
    }
  } catch (e) {
    status("Connection failed", true);
  }
}

// ---------- Bind UI ----------
function bindUI() {
  if (IS_FILE) $("fileWarning").style.display = 'block';

  $("enableToggle").addEventListener('change', e => setEnabled(e.target.checked));

  $("messageInput").addEventListener('input', () => pushText($("messageInput").value));

  $("fontSizeSlider").addEventListener('input', e => {
    $("fontSizeDisplay").textContent = e.target.value;
  });
  $("fontDecrease").onclick = () => {
    const v = Math.max(10, +$("fontSizeSlider").value - 1);
    $("fontSizeSlider").value = v;
    $("fontSizeDisplay").textContent = v;
  };
  $("fontIncrease").onclick = () => {
    const v = Math.min(72, +$("fontSizeSlider").value + 1);
    $("fontSizeSlider").value = v;
    $("fontSizeDisplay").textContent = v;
  };
  $("applyFontBtn").onclick = () => applyFont(+$("fontSizeSlider").value);

  $("resetPosBtn").onclick = resetPosition;

  $("agentBtn").onclick = () => setAgent($("agentInput").value);

  $("agentInput").addEventListener('input', e => {
    const raw = e.target.value.trim();
    if (!raw) { e.target.dataset.preview = ''; return; }
    e.target.dataset.preview = normalizeAgentName(raw);
  });

  const rec = setupVoice("messageInput", "adminVoiceStatus", "adminVoiceBtn");
  $("adminVoiceBtn").onclick = () => {
    if (recognition) stopVoice("adminVoiceBtn", "adminVoiceStatus");
    else if (rec) startVoice(rec, "messageInput", "adminVoiceStatus", "adminVoiceBtn");
  };
}

// ---------- Boot ----------
(function boot() {
  bindUI();

  const urlHwid = params.get('hwid');
  if (urlHwid) { autoLoad(urlHwid); return; }

  const saved = localStorage.getItem("hwid");
  if (saved) { autoLoad(saved); return; }

  $("hwidDisplay").textContent = "Open with ?hwid=YOUR_HWID in the URL";
  status("No HWID provided", true);
})();

document.addEventListener('contextmenu', e => e.preventDefault());
</script>
</body>
</html>
